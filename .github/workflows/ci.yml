name: Mehay CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mehay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install PDF page renderer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_BASE_PATH: /mehay
      - run: docker build --target app --build-arg VITE_APP_BASE_PATH=/mehay --tag mehay:${{ github.sha }} .
      - name: Reject app startup without verified private materials
        run: |
          set +e
          timeout 15s docker run --rm --network none \
            --env MEHAY_KB_DIR=/missing-knowledge \
            --env NEURODVS_DATA_PATH=/missing-vehicles.json \
            mehay:${{ github.sha }}
          status=$?
          set -e
          test "$status" -eq 1 || { echo "app image did not fail private-material validation (status $status)" >&2; exit 1; }
      - run: docker build --target neurodvs-mocks --tag mehay-mocks:${{ github.sha }} .

  deployment-auth:
    if: github.repository == 'stress-ins/mehay' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the Mehay-scoped VPS key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: test -n "$VPS_SSH_KEY" || { echo 'Missing required Mehay repository secret VPS_SSH_KEY' >&2; exit 1; }

  publish-image:
    if: github.repository == 'stress-ins/mehay' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, deployment-auth]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      mocks_digest: ${{ steps.mocks.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: VITE_APP_BASE_PATH=/mehay
      - name: Report immutable candidate
        run: |
          echo "Image candidate: ghcr.io/${GITHUB_REPOSITORY}@${{ steps.image.outputs.digest }}"
      - name: Build and publish private-network NeuroDVS mocks
        uses: docker/build-push-action@v6
        id: mocks
        with:
          context: .
          target: neurodvs-mocks
          push: true
          tags: ghcr.io/${{ github.repository }}-mocks:${{ github.sha }}

  deploy:
    if: github.repository == 'stress-ins/mehay' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Transfer deployment files and switch the exact image
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish-image.outputs.digest }}
          MOCK_IMAGE: ghcr.io/${{ github.repository }}-mocks@${{ needs.publish-image.outputs.mocks_digest }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo 'Missing required Mehay repository secret VPS_SSH_KEY' >&2; exit 1; }
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 0600 "$HOME/.ssh/id_rsa"
          cat > "$HOME/.ssh/known_hosts" <<'HOSTKEY'
          46.32.186.192 ssh-rsa 
          HOSTKEY
          ssh_options='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='"$HOME"'/.ssh/known_hosts'
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@46.32.186.192 'install -d -o root -g root -m 0750 /opt/mehay/deploy'
          rsync --archive --compress --delete -e "$ssh_options -i $HOME/.ssh/id_rsa" deploy/ root@46.32.186.192:/opt/mehay/deploy/
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" root@46.32.186.192 "/opt/mehay/deploy/remote-switch.sh '$IMAGE' '$MOCK_IMAGE' '$REGISTRY_USER'"
